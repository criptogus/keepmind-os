# Builds unsigned installers (macOS arm64+x64, Windows x64) and publishes them to the GitHub release for the tag.
# Consumes GitHub Actions macOS and Windows minutes.
name: Release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and publish (e.g. v0.1.1)"
        required: true
permissions:
  contents: write
concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false
jobs:
  mac:
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24.x"
          cache: npm
      - name: Check tag matches package.json version
        run: |
          PKG="v$(node -p "require(\"./package.json\").version")"
          if [ "$PKG" != "$TAG" ]; then echo "Tag $TAG does not match package.json $PKG"; exit 1; fi
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run build
      - name: Package (unsigned, no notarization)
        run: npx electron-builder --mac --arm64 --x64 --publish never
      - name: Publish assets to release
        run: |
          shopt -s nullglob
          for file in release/*.dmg release/*.zip release/*.blockmap; do
            basename=${file##*/}
            if [[ "$basename" == *" "* ]]; then
              mv -v "$file" "release/${basename// /-}"
            fi
          done
          FILES=(release/*.dmg release/*.zip release/*.blockmap release/latest-mac.yml)
          if [ ${#FILES[@]} -lt 9 ]; then echo "Expected 9 assets, got ${#FILES[@]}: ${FILES[*]}"; exit 1; fi
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --draft --title "KeepMind OS $TAG" --generate-notes
          fi
          gh release upload "$TAG" "${FILES[@]}" --repo "$GITHUB_REPOSITORY" --clobber
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest

  win:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24.x"
          cache: npm
      - name: Check tag matches package.json version
        run: |
          PKG="v$(node -p "require(\"./package.json\").version")"
          if [ "$PKG" != "$TAG" ]; then echo "Tag $TAG does not match package.json $PKG"; exit 1; fi
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run build
      - name: Package (unsigned)
        run: npx electron-builder --win --x64 --publish never
      - name: Publish assets to release
        run: |
          shopt -s nullglob
          for file in release/*.exe release/*.zip release/*.blockmap; do
            basename=${file##*/}
            if [[ "$basename" == *" "* ]]; then
              mv -v "$file" "release/${basename// /-}"
            fi
          done
          FILES=(release/*.exe release/*.zip release/*.blockmap release/latest.yml)
          if [ ${#FILES[@]} -lt 4 ]; then echo "Expected at least 4 assets, got ${#FILES[@]}: ${FILES[*]}"; exit 1; fi
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --draft --title "KeepMind OS $TAG" --generate-notes
          fi
          # Only upload assets here; the mac job owns draft/latest state to avoid a publish race.
          gh release upload "$TAG" "${FILES[@]}" --repo "$GITHUB_REPOSITORY" --clobber
