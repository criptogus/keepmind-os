# Run from the repository root. Build this fork, never pull the upstream app image.
name: keepmind
services:
  postgres:
    # The same pinned image as the root docker-compose.yml.
    image: pgvector/pgvector:0.8.7-pg18@sha256:2358fcba361ed2233a5ed81b5fe4ca779ccb304120ce531a3bf51c0ed7e2bc11
    environment:
      POSTGRES_DB: keepmind
      POSTGRES_USER: keepmind
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a database password}
    volumes:
      - postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U keepmind -d keepmind"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
  backup:
    # A pg_dump a day to an S3-compatible bucket (deploy/backup). On with `--profile backup` and S3_BACKUP_BUCKET
    # plus the S3_* credentials in .env; restore is described in SELF_HOSTING.md, Backups.
    build:
      context: ../backup
    image: keepmind-backup:local
    profiles: ["backup"]
    # Its own variables only, not the whole .env: it has no use for the app's secrets.
    environment:
      DATABASE_URL: postgres://keepmind:${POSTGRES_PASSWORD}@postgres:5432/keepmind
      S3_ENDPOINT: "${S3_ENDPOINT:-}"
      S3_REGION: "${S3_REGION:-}"
      S3_PROVIDER: "${S3_PROVIDER:-}"
      S3_ACCESS_KEY_ID: "${S3_ACCESS_KEY_ID:-}"
      S3_SECRET_ACCESS_KEY: "${S3_SECRET_ACCESS_KEY:-}"
      S3_BACKUP_BUCKET: "${S3_BACKUP_BUCKET:-}"
      BACKUP_RETENTION_DAYS: "${BACKUP_RETENTION_DAYS:-}"
      BACKUP_INTERVAL_HOURS: "${BACKUP_INTERVAL_HOURS:-}"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    init: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
  app:
    build:
      context: ../..
    image: keepmind-os:local
    env_file: .env
    environment:
      DATABASE_URL: postgres://keepmind:${POSTGRES_PASSWORD}@postgres:5432/keepmind
      PUBLIC_URL: https://keepmind.io
      SOURCE_URL: https://github.com/criptogus/keepmind-os
      FILES_DIR: /data/files
      ALLOW_SIGNUP: "false"
      # While no account exists, only <PUBLIC_URL>/owner#claim=<token> creates the first one (apps/server/src/owner-claim.ts).
      OWNER_CLAIM_SHA256: ${OWNER_CLAIM_SHA256:?Set the first-owner claim hash}
      MODEL_ENDPOINTS_PRIVATE: "false"
      PUSH_SENDER: "off"
      FEEDBACK_RELAY: "false"
      TELEMETRY: "false"
      DESKTOP_RELEASES_REPO: criptogus/keepmind-os
    volumes:
      - files:/data/files
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    stop_grace_period: 40s
  proxy:
    image: caddy:2.11.7-alpine@sha256:d8542f48d34a9cf4e4c11a478865229840e87e4c96ea3f439101f31a5d35f75f
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy:/data
      - caddy-config:/config
    # The image's own HEALTHCHECK (/api/health): no traffic before migrations finish.
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped
volumes:
  postgres:
  files:
  caddy:
  caddy-config:
